[build-system]
# >=77, not >=68: `license = "MIT"` below is the PEP 639 SPDX expression
# form, and setuptools only accepts it from 77.0.0. Earlier versions raise
# `ValueError: invalid pyproject.toml config: 'project.license'` -- verified
# against 68.2.2 and 76.1.0, which both fail, and 77.0.3, which succeeds and
# emits the `License-Expression: MIT` the installed metadata carries.
#
# pip's build isolation always fetches the newest setuptools, so nothing on
# the happy path ever exercises this floor. It bites on
# `--no-build-isolation`, a pinned or offline builder, or a distro
# setuptools.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deckle"
version = "0.1.0"
description = "Desktop app for imposing and printing booklets from PDF and image sources."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Caleb Bennett" },
]
dependencies = [
    "pikepdf",
    "pypdfium2",
    "img2pdf",
    "natsort",
    "Pillow",
    "PySide6",
]

[project.scripts]
# Named after the two executables `packaging/deckle.spec` freezes, and
# meaning the same two things, so one word does not mean the GUI on a
# packaged machine and the CLI on a pip-installed one. Until this table
# existed, `pip install -e .` -- the only install command any human-facing
# document gives -- installed neither, and every command line in the
# README and the GUIDE named something that was not there. That is why a
# reader reaches for `python -m deckle`, which is how S9 was found.
#
# `deckle.__main__:run`, not `deckle.app.main:main`: `run` answers
# `--help` and `--version` before `QApplication` exists (S9), and the
# console script must not be the one path that skips that.
#
# `tests/test_console_scripts.py` holds both halves of this.
deckle = "deckle.__main__:run"
deckle-cli = "deckle.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    # Property-based testing for the imposition arithmetic. MPL-2.0,
    # verified from its own LICENSE.txt, and test-only -- it never
    # enters the shipped closure the licence audits guard.
    "hypothesis",
]
# Documentation tooling only. Deliberately NOT a runtime dependency:
# Deckle is MIT and must install and run without Sphinx present.
docs = [
    "sphinx>=7",
]
# Packaging tooling only. PyInstaller is GPLv2-or-later WITH an explicit
# exception permitting distribution of programs under any licence, which
# is what makes bundling this MIT app lawful. Build-time only; it never
# enters the runtime closure test_license_audit.py walks.
package = [
    "pyinstaller>=6",
]

[tool.setuptools.packages.find]
include = ["deckle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: measures real resource usage (e.g. peak RSS across a 500-page export); slower than a unit test but still executes and asserts",
]
