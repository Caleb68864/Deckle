[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deckle"
version = "0.1.0"
description = "Desktop app for imposing and printing booklets from PDF and image sources."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Caleb Bennett" },
]
dependencies = [
    "pikepdf",
    "pypdfium2",
    "img2pdf",
    "natsort",
    "Pillow",
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# Documentation tooling only. Deliberately NOT a runtime dependency:
# Deckle is MIT and must install and run without Sphinx present.
docs = [
    "sphinx>=7",
]
# Packaging tooling only. PyInstaller is GPLv2-or-later WITH an explicit
# exception permitting distribution of programs under any licence, which
# is what makes bundling this MIT app lawful. Build-time only; it never
# enters the runtime closure test_license_audit.py walks.
package = [
    "pyinstaller>=6",
]

[tool.setuptools.packages.find]
include = ["deckle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: measures real resource usage (e.g. peak RSS across a 500-page export); slower than a unit test but still executes and asserts",
]
