# The suite, on a machine that is not the author's.
#
# Every one of R0.1-R0.5 was a defect that was true on one Windows working
# tree and false everywhere else: a test fixture that was never committed,
# an undeclared numpy import, a build spec swallowed by `*.spec`, a `chmod`
# constant that means "writable" on Windows and "unreadable" on POSIX, and a
# stray file named `=` left by a shell redirect. All five would have failed
# on the first push here. That is what this job is for -- not coverage, not
# gatekeeping, just a second machine.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A push that supersedes an in-flight run cancels it. The suite is
    # ~60s; this is about not queueing behind yourself, not about cost.
    #
    # On the JOB, not the workflow. Declared at workflow level it also
    # cancelled `package-audit` below -- a 30-minute release gate whose
    # only trigger is a push to `main`, on a project that merges locally
    # and pushes commits minutes apart. A cancelled run is neither green
    # nor red, so the gate could stop running and say nothing.
    #
    # The group carries `matrix.python-version` because a job-level group
    # is shared by every leg of the matrix: without it, 3.11, 3.12 and
    # 3.14 would cancel each other inside a single run, and `fail-fast:
    # false` above exists precisely so all three report.
    concurrency:
      group: tests-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true
    strategy:
      # Every interpreter reports. A failure on one is a fact about that
      # one, and cancelling the others throws away the comparison that
      # makes it diagnosable.
      fail-fast: false
      matrix:
        # 3.11 is the floor `pyproject.toml` and the README both claim, so
        # it is tested rather than merely asserted. `run.bat` says 3.12+;
        # that is a documentation drift item, not a second opinion about
        # what the code supports.
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # There is no lockfile; the extras live in pyproject.toml, so
          # that is what the cache key hashes.
          cache-dependency-path: pyproject.toml

      # PySide6 ships its own Qt, but Qt still links the system's EGL,
      # fontconfig, xkbcommon and dbus. Without these the offscreen
      # platform plugin fails to load and every Qt test dies with
      # "could not load the Qt platform plugin" rather than an assertion.
      # No X server and no Xvfb: nothing in the suite needs a display.
      - name: Install the libraries Qt links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libopengl0 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libxkbcommon0

      - name: Install Deckle and its test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Printed rather than asserted. This is the first thing a bug report
      # asks for, and it exercises the importlib.metadata path that the
      # frozen build once got silently wrong -- a "not installed" here
      # would be worth knowing about before it reaches a bundle.
      - name: Report what is installed
        run: python -m deckle.cli --version

      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --no-header -p no:cacheprovider

  package-audit:
    # The other half of the licence defence, and the half that had never run.
    #
    # `tests/test_license_audit.py` walks the *declared* dependency closure and
    # runs on every push here. `tests/test_packaging_audit.py` checks what the
    # packager actually copied into `dist/`, which is a different question with
    # a worse history: the first PyInstaller build produced a 1.6 GB bundle
    # containing torch, paddle, cv2 and pymupdf -- AGPL, in an MIT program --
    # while every dependency-level audit passed, because none of those was a
    # Deckle dependency. They were merely present in the developer's
    # environment, and PyInstaller bundles what it can reach.
    #
    # Those 14 tests skip when `dist/` is empty, so they were green and silent
    # on every run of this workflow. The build that gives them something to
    # judge is `run.bat package` -- a Windows batch file -- and this workflow
    # was ubuntu-only, so the artifact gate had never once executed.
    #
    # Rather than port the build, run it where it already works. `run.bat
    # package` creates a clean `.buildenv` holding only Deckle's real
    # dependencies (rule 1 of that file's docstring: excluding offenders by
    # name is whack-a-mole against an environment you do not control), builds
    # through `packaging/deckle.spec`, and then runs the audit against the
    # result.
    name: packaged artifact (Windows)
    runs-on: windows-latest
    # Not on pull requests: it is a release gate measured in minutes, and the
    # dependency-level audit -- which now reads PEP 639 `License-Expression`,
    # having been blind to three of Deckle's own dependencies until
    # 2026-09-09 -- already runs on every PR.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # One version. This job asks what the packager copies, which does
          # not vary by interpreter the way the suite might.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `run.bat package` runs the audit with the *outer* interpreter, not
      # the build environment's, so pytest has to be here rather than in
      # `.buildenv` -- which stays clean, which is the entire point of it.
      - name: Install pytest for the audit step
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Builds into a clean .buildenv, then runs tests/test_packaging_audit.py
      # against dist/deckle. Fails the job on an AGPL hit or an oversized
      # bundle, which is what it is here to do.
      - name: Build the bundle and audit it
        shell: cmd
        run: run.bat package

      # Kept regardless of outcome: on a failure the listing is the evidence,
      # and on a pass it is the record of what a green audit was measuring.
      - name: Keep the bundle listing
        if: always()
        shell: bash
        run: |
          if [ -d dist/deckle ]; then
            du -sh dist/deckle
            find dist/deckle -maxdepth 1 | sort | head -50
          else
            echo "no dist/deckle -- the build did not get that far"
          fi
